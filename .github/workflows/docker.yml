name: Docker Image Release

on:
  workflow_dispatch:
    inputs:
      release_number:
        description: "Cut number since forking from v0.7.5 (image tag becomes v0.7.5-nightconcept.<n>-hledger)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  docker-hledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          file: ./Dockerfile.hledger
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:v0.7.5-nightconcept.${{ github.event.inputs.release_number }}-hledger
            ghcr.io/${{ github.repository }}:latest-hledger
